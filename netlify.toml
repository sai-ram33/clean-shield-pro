# Netlify Production Configuration - Clean Shield Pro
# Serves frontend static assets and proxies /api requests to Render

[build]
  command = ""
  publish = "frontend"

# Proxy /api requests to live Render Express API
[[redirects]]
  from = "/api/*"
  to = "https://clean-shield-pro.onrender.com/api/:splat"
  status = 200
  force = true
  headers = {X-From = "Netlify-Proxy"}

# Production Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
